name: Hospital Simulation Training Platform CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build Test Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Lint Frontend
        run: npm run lint --prefix frontend

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --no-build

      - name: Publish Incident Simulator
        run: dotnet publish AIHealthcareSimulation.Simulator/AIHealthcareSimulation.Simulator.csproj -c Release -o publish/Simulator

      - name: Publish API
        run: dotnet publish AIHealthcareSimulation.Api/AIHealthcareSimulation.Api.csproj -c Release -o publish/Api

      - name: Package Frontend
        run: mkdir -p publish/Frontend && cp -R frontend/dist/. publish/Frontend/

      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: AIHealthcareSimulation
          path: publish/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore